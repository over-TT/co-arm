name: Source validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-and-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            software/python/pyproject.toml
            software/python/requirements.lock
            software/operations/requirements-pi.txt
      - name: Install the locked Python stack and audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement software/python/requirements.lock
          python -m pip install --no-deps --editable ./software/python
          python -m pip install build==1.5.0 pip-audit==2.10.1
          python -m pip check
      - name: Audit the Python and Raspberry Pi dependency graphs
        run: |
          python -m pip_audit --strict --progress-spinner off --requirement software/python/requirements.lock
          python -m pip_audit --strict --progress-spinner off --requirement software/operations/requirements-pi.txt
      - name: Validate the source manifest and release tree
        run: |
          python tools/build_source_manifest.py --check
          python tools/check_repo.py
      - name: Run the gateway, backend, MCP, and simulator contract tests
        working-directory: software/python
        run: python -m pytest -q -p no:cacheprovider
      - name: Run the Arm HAT host tests
        working-directory: software/python
        run: python -m pytest -q -p no:cacheprovider ../firmware/tests/test_arm_hat_controller_v1.py
      - name: Build and smoke the installed Python wheel artifact
        run: |
          python -m build --wheel --outdir .codex-tmp/wheel software/python
          python -m venv .codex-tmp/wheel-venv
          .codex-tmp/wheel-venv/bin/python -m pip install --requirement software/python/requirements.lock
          .codex-tmp/wheel-venv/bin/python -m pip install --no-deps .codex-tmp/wheel/*.whl
          (
            cd .codex-tmp
            wheel-venv/bin/python ../software/python/tests/installed_wheel_smoke.py
          )

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.x"
          cache: pnpm
          cache-dependency-path: software/dashboard/pnpm-lock.yaml
      - name: Install locked dashboard dependencies
        working-directory: software/dashboard
        run: pnpm install --frozen-lockfile
      - name: Audit high-severity dashboard dependencies
        working-directory: software/dashboard
        run: pnpm audit --audit-level high
      - name: Test the standalone ARM dashboard
        working-directory: software/dashboard
        run: pnpm test
      - name: Build the standalone ARM dashboard
        working-directory: software/dashboard
        run: pnpm build

  operations-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse the retained operations scripts
        shell: pwsh
        run: |
          $failed = $false
          $scripts = Get-ChildItem -LiteralPath software\operations\scripts -Filter *.ps1 -File
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref] $tokens,
              [ref] $parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $failed = $true
              Write-Error "$($script.Name): $($parseErrors -join '; ')"
            }
          }
          if ($failed) {
            throw "One or more operations scripts failed to parse."
          }
          Write-Output "Parsed $($scripts.Count) PowerShell scripts."
      - name: Exercise Windows recovery preparation and permission gates
        working-directory: software/python
        shell: pwsh
        run: |
          python -m pip install pytest==9.0.3
          if ($LASTEXITCODE -ne 0) { throw "Recovery test dependency installation failed." }
          python -m pytest -q -p no:cacheprovider robot_gateway/tests/test_prepare_arm_recovery.py robot_gateway/tests/test_arm_pi_restore_script.py robot_gateway/tests/test_arm_pi_backup_script.py
          if ($LASTEXITCODE -ne 0) { throw "Windows recovery regressions failed." }
